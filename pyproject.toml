[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miniclaw"
version = "0.1.0"
description = "A handwritten Agent Harness for learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]

[project.scripts]
miniclaw = "miniclaw.cli.repl:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
